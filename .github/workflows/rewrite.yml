name: Go desktop rewrite

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config gnome-keyring dbus-x11
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l app.go main.go internal)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Bootstrap embedded assets for a clean checkout
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html
      - name: Generate desktop bindings
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            wails generate module -tags webkit2_41
          else
            wails generate module
          fi
      - name: Typecheck and build frontend
        run: npm test && npm run build
        working-directory: frontend
      - name: Test and vet Go
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            go test -tags webkit2_41 ./...
            go vet -tags webkit2_41 ./...
          else
            go test ./...
            go vet ./...
          fi
      - name: Test native Windows credential vault
        if: runner.os == 'Windows'
        env:
          SEQUEL_TEST_KEYRING: '1'
        run: go test ./internal/credentials -run TestNativeVault -v -count=1
      - name: Test isolated macOS credential vault
        if: runner.os == 'macOS'
        run: |
          original_keychain="$(security default-keychain -d user | tr -d '\"' | sed 's/^ *//')"
          qa_keychain="$RUNNER_TEMP/rewrite-qa.keychain-db"
          trap 'security default-keychain -d user -s "$original_keychain"; security delete-keychain "$qa_keychain"' EXIT
          security create-keychain -p rewrite-ci-only "$qa_keychain"
          security unlock-keychain -p rewrite-ci-only "$qa_keychain"
          security default-keychain -d user -s "$qa_keychain"
          SEQUEL_TEST_KEYRING=1 go test ./internal/credentials -run TestNativeVault -v -count=1
      - name: Test isolated Linux credential vault
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -e -c '
            printf %s rewrite-ci-only | gnome-keyring-daemon --unlock --components=secrets
            SEQUEL_TEST_KEYRING=1 go test ./internal/credentials -run TestNativeVault -v -count=1
          '
      - name: Build desktop application
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            wails build -tags webkit2_41
          else
            wails build
          fi
      - name: Package macOS bundle preserving permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/sequel-rewrite.app build/bin/sequel-rewrite-macos.zip
      - name: Package Linux executable preserving permissions
        if: runner.os == 'Linux'
        run: tar -czf build/bin/sequel-rewrite-linux.tar.gz -C build/bin sequel-rewrite
      - uses: actions/upload-artifact@v4
        with:
          name: sequel-rewrite-${{ matrix.os }}
          if-no-files-found: error
          path: |
            build/bin/*.zip
            build/bin/*.exe
            build/bin/*.tar.gz

  database-integration:
    name: Database (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 --silent
          - image: mariadb:11.4
            health: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: rewrite-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache-dependency-path: go.sum
      - name: Test actual MySQL/MariaDB sessions
        env:
          SEQUEL_TEST_PORT: '3306'
          SEQUEL_TEST_PASSWORD: rewrite-ci-only
        run: go test -race ./internal/database ./internal/workspace ./internal/tunnel -v -count=1 -timeout=180s
