name: Go desktop rewrite

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release version; stable tags publish, prerelease tags create drafts'
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and release target
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          version=0.1.0
          label="dev-${GITHUB_SHA:0:7}"
          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo 'Expected a version such as v0.1.0 or v0.1.0-alpha.1' >&2
              exit 1
            fi
            parts=( "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}" )
            for part in "${parts[@]}"; do
              if (( ${#part} > 5 || 10#$part > 65535 )); then
                echo 'Version components must be at most 65535 for Windows metadata' >&2
                exit 1
              fi
            done
            version="${parts[0]}.${parts[1]}.${parts[2]}"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
            fi
            label="$tag"
          fi
          printf 'tag=%s\nversion=%s\nlabel=%s\n' "$tag" "$version" "$label" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.4.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config gnome-keyring dbus-x11 xvfb x11-utils
      - name: Install Windows installer tools
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (!(Test-Path (Join-Path $nsis 'makensis.exe'))) { throw 'NSIS is missing' }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Bootstrap embedded assets for a clean checkout
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/index.html
      - name: Generate desktop bindings
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            wails generate module -tags webkit2_41
          else
            wails generate module
          fi
      - name: Typecheck and build frontend
        run: npm test && npm run build
        working-directory: frontend
      - name: Install UI test engines
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install chromium webkit
          fi
        working-directory: frontend
      - name: Verify UI controls and layout in Chromium and WebKit
        run: npm run test:ui
        working-directory: frontend
      - name: Upload UI screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-checks-${{ matrix.os }}
          path: frontend/test-results/
          if-no-files-found: ignore
      - name: Test and vet Go
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            go test -tags webkit2_41 ./...
            go vet -tags webkit2_41 ./...
          else
            go test ./...
            go vet ./...
          fi
      - name: Test native smoke probes
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Test native Windows credential vault
        if: runner.os == 'Windows'
        env:
          SEQUEL_TEST_KEYRING: '1'
        run: go test ./internal/credentials -run TestNativeVault -v -count=1
      - name: Test isolated macOS credential vault
        if: runner.os == 'macOS'
        run: |
          original_keychain="$(security default-keychain -d user | tr -d '\"' | sed 's/^ *//')"
          qa_keychain="$RUNNER_TEMP/rewrite-qa.keychain-db"
          trap 'security default-keychain -d user -s "$original_keychain"; security delete-keychain "$qa_keychain"' EXIT
          security create-keychain -p rewrite-ci-only "$qa_keychain"
          security unlock-keychain -p rewrite-ci-only "$qa_keychain"
          security default-keychain -d user -s "$qa_keychain"
          SEQUEL_TEST_KEYRING=1 go test ./internal/credentials -run TestNativeVault -v -count=1
      - name: Test isolated Linux credential vault
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -e -c '
            printf %s rewrite-ci-only | gnome-keyring-daemon --unlock --components=secrets
            SEQUEL_TEST_KEYRING=1 go test ./internal/credentials -run TestNativeVault -v -count=1
          '
      - name: Set application version
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e 'const fs = require("fs"); const p = "wails.json"; const config = JSON.parse(fs.readFileSync(p)); config.info.productVersion = process.env.BUILD_VERSION; fs.writeFileSync(p, JSON.stringify(config, null, 2) + "\n");'
      - name: Build desktop application
        env:
          BUILD_LABEL: ${{ needs.prepare.outputs.label }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            wails build -platform linux/amd64 -tags webkit2_41 -ldflags "-X main.buildVersion=$BUILD_LABEL"
          elif [ "$RUNNER_OS" = Windows ]; then
            wails build -platform windows/amd64 -nsis -ldflags "-X main.buildVersion=$BUILD_LABEL"
            test -f build/bin/sequelx-amd64-installer.exe
          else
            wails build -platform darwin/arm64 -ldflags "-X main.buildVersion=$BUILD_LABEL"
          fi
      - name: Native Linux startup with isolated configuration
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python3 tools/native_smoke.py build/bin/sequelx --report qa/native-startup-linux.json
      - name: Clean Windows installer startup
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'sequelx-clean-install'
          if (Test-Path $target) { throw 'Clean install path already exists' }
          $setup = Start-Process -FilePath 'build/bin/sequelx-amd64-installer.exe' -ArgumentList '/S',("/D=" + $target) -PassThru
          if (!$setup.WaitForExit(120000)) { $setup.Kill(); throw 'Installer timed out' }
          if ($setup.ExitCode -ne 0) { throw 'Installer failed' }
          $binary = Join-Path $target 'sequelx.exe'
          if (!(Test-Path $binary)) { throw 'Installed executable missing' }
          if (!(Test-Path (Join-Path $target 'LICENSE'))) { throw 'Installed license missing' }
          python tools/native_smoke.py $binary --report qa/native-startup-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows smoke test failed' }
      - name: Upload native startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-startup-${{ matrix.os }}
          path: qa/
          if-no-files-found: ignore
      - name: Package distribution files
        env:
          BUILD_LABEL: ${{ needs.prepare.outputs.label }}
        run: |
          mkdir -p dist staging/sequelx
          cp LICENSE README.md staging/sequelx/
          base="sequelx-$BUILD_LABEL"
          if [ "$RUNNER_OS" = macOS ]; then
            ditto build/bin/sequelx.app staging/sequelx/sequelx.app
            codesign --verify --deep staging/sequelx/sequelx.app
            ditto -c -k --keepParent staging/sequelx "dist/$base-macos-arm64.zip"
            ln -s /Applications staging/sequelx/Applications
            hdiutil create -volname 'sequelx' -srcfolder staging/sequelx -ov -format UDZO "dist/$base-macos-arm64.dmg"
            hdiutil verify "dist/$base-macos-arm64.dmg"
          elif [ "$RUNNER_OS" = Windows ]; then
            cp build/bin/sequelx.exe staging/sequelx/
            cp build/bin/sequelx-amd64-installer.exe "dist/$base-windows-amd64-setup.exe"
            powershell.exe -NoProfile -Command 'Compress-Archive -Path staging/sequelx -DestinationPath ("dist/sequelx-" + $env:BUILD_LABEL + "-windows-amd64-portable.zip")'
          else
            cp build/bin/sequelx staging/sequelx/
            tar -czf "dist/$base-linux-amd64.tar.gz" -C staging/sequelx .
            tar -tzf "dist/$base-linux-amd64.tar.gz"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sequelx-${{ matrix.os }}
          if-no-files-found: error
          path: dist/*

  release:
    name: Publish distribution release
    needs: [prepare, desktop, database-integration]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: sequelx-*
          merge-multiple: true
          path: dist
      - name: Verify packages and write checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          base="sequelx-$RELEASE_TAG"
          for suffix in macos-arm64.zip macos-arm64.dmg windows-amd64-setup.exe windows-amd64-portable.zip linux-amd64.tar.gz; do
            test -s "dist/$base-$suffix"
          done
          cd dist
          sha256sum -- *.zip *.dmg *.exe *.tar.gz > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create release with all packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then flags=(--draft --prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" "${flags[@]}" --title "sequelx $RELEASE_TAG" --notes-file docs/release-notes.md

  database-integration:
    name: Database (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 --silent
          - image: mariadb:11.4
            health: healthcheck.sh --connect --innodb_initialized
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: rewrite-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache-dependency-path: go.sum
      - name: Test actual MySQL/MariaDB sessions
        env:
          SEQUEL_TEST_PORT: '3306'
          SEQUEL_TEST_PASSWORD: rewrite-ci-only
        run: go test -race ./internal/database ./internal/workspace ./internal/tunnel -v -count=1 -timeout=180s
